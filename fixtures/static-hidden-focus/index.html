<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account settings</title>
    <style>
      button { min-width: 44px; min-height: 44px; padding: 0.5rem 1rem; }
      :focus-visible { outline: 3px solid #175cd3; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Account settings</h1>
      <div id="retired-actions" aria-hidden="true">
        <p>Legacy reporting is no longer available.</p>
        <button id="legacy-export" type="button" disabled>Export legacy report</button>
      </div>
      <button id="save-changes" type="button">Save changes</button>
      <p role="status" aria-live="polite"></p>
    </main>
    <script>
      const saveChanges = document.querySelector("#save-changes");
      const status = document.querySelector("[role='status']");

      saveChanges.addEventListener("click", () => {
        status.textContent = "Changes saved.";
      });
    </script>
  </body>
</html>
