<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Profile</title></head>
  <body>
    <main>
      <h1>Profile</h1>
      <form method="post">
        <input id="display-name" name="display_name" autocomplete="name">
        <button type="submit">Save</button>
      </form>
      {% if status %}
        <p role="status">{{ status }}</p>
      {% endif %}
    </main>
  </body>
</html>
